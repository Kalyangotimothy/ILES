services:
  # Django Backend
  - type: web
    name: iles-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --no-input
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        # Set to your Cloudflare Pages URL after first deploy (e.g. https://iles.pages.dev)
        value: https://iles.pages.dev
      - key: DATABASE_URL
        fromDatabase:
          name: iles-db
          property: connectionString

databases:
  - name: iles-db
    databaseName: iles
    plan: free
