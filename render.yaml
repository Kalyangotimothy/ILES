services:
  # Django Backend
  - type: web
    name: iles-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --no-input
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        # Update this after the frontend is deployed with its actual URL
        value: https://iles-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: iles-db
          property: connectionString

  # React Frontend (Static Site)
  - type: web
    name: iles-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        # Update this if your backend URL differs (check Render dashboard after first deploy)
        value: https://iles-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: iles-db
    databaseName: iles
    plan: free
